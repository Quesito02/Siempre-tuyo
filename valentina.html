<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6ea">
<title>Siempre tuyo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  --papel: #fff6ea;
  --papel2: #fdeedd;
  --tinta: #c8106a;
  --tinta-suave: #e7609f;
  --rosa: #ffd9e8;
  --texto: #4a2a38;
  --muted: #9a7383;
  --linea: #f1c9da;
  --ok: #2fa36b;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0; color: var(--texto); font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.45;
  background-color: var(--papel);
  /* puntitos fucsia como en el boceto */
  background-image:
    radial-gradient(circle, var(--tinta) 0 5px, transparent 6px),
    radial-gradient(circle, var(--tinta) 0 4px, transparent 5px),
    radial-gradient(circle, var(--tinta-suave) 0 3px, transparent 4px);
  background-size: 230px 260px, 170px 310px, 120px 190px;
  background-position: 20px 40px, 110px 160px, 60px 90px;
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; background: color-mix(in srgb, var(--papel) 88%, transparent); z-index: -1; }
main { max-width: 560px; margin: 0 auto; padding: 0 16px 60px; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.mano { font-family: "Caveat", cursive; font-weight: 700; color: var(--tinta); }
.volver { position: fixed; top: 12px; left: 12px; z-index: 20; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: #fffffff0; border: 2px solid var(--tinta); text-decoration: none; color: var(--tinta); font-size: 20px; font-weight: 700; }

/* ---------- encabezado ---------- */
header.portada { text-align: center; padding: 64px 0 10px; }
header.portada h1 { font-size: clamp(64px, 20vw, 108px); line-height: .9; margin: 0; transform: rotate(-3deg); letter-spacing: -1px; }
header.portada p { max-width: 380px; margin: 18px auto 0; color: var(--muted); font-family: "Lora", serif; font-style: italic; font-size: 16px; }

/* ---------- cajas del índice (estilo dibujado a mano) ---------- */
nav.indice { display: grid; justify-items: center; gap: 14px; margin: 34px 0 10px; }
nav.indice a { display: block; width: min(240px, 70%); text-align: center; text-decoration: none; font-family: "Caveat", cursive; font-weight: 700;
  font-size: 34px; color: var(--tinta); padding: 4px 14px; background: #fffdf8;
  border: 3px solid var(--tinta); border-radius: 14px 6px 16px 5px / 6px 16px 5px 14px; box-shadow: 4px 5px 0 var(--rosa);
  transition: transform .15s; }
nav.indice a:nth-child(odd) { transform: rotate(-2.5deg); }
nav.indice a:nth-child(even) { transform: rotate(2deg) translateX(10px); }
nav.indice a:active { transform: scale(.96); }

/* ---------- secciones ---------- */
section.bloque { margin-top: 56px; scroll-margin-top: 20px; }
section.bloque > h2 { font-size: 46px; margin: 0; line-height: 1; display: inline-block; position: relative; }
section.bloque > h2::after { content: ""; position: absolute; left: -4px; right: -8px; bottom: -4px; height: 10px;
  background: var(--rosa); border-radius: 50% 40% 60% 30%; z-index: -1; transform: rotate(-1deg); }
.intro { color: var(--muted); margin: 10px 0 18px; }
.tarjeta { background: #fffdf8; border: 2px solid var(--linea); border-radius: 18px; padding: 16px; }

/* ---------- vales ---------- */
.vales { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.vale { position: relative; text-align: left; border: 2px dashed var(--tinta); border-radius: 14px; padding: 14px 14px 12px; background: #fff;
  min-height: 132px; display: flex; flex-direction: column; gap: 6px; transition: transform .2s, background .3s; overflow: hidden;
  -webkit-mask: radial-gradient(circle 9px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat; }
.vale small { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--tinta-suave); }
.vale b { font-family: "Caveat", cursive; font-size: 25px; line-height: 1.05; color: var(--tinta); }
.vale span { font-size: 12.5px; color: var(--muted); }
.vale:active { transform: scale(.97); }
.vale.canjeado { background: var(--papel2); }
.vale.canjeado b, .vale.canjeado span { opacity: .45; }
.sello { position: absolute; right: 8px; bottom: 14px; transform: rotate(-14deg); border: 3px solid var(--ok); color: var(--ok); border-radius: 8px;
  padding: 1px 8px; font-family: "Caveat", cursive; font-weight: 700; font-size: 22px; background: #ffffffcc; animation: sello .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes sello { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } }
.quien { font-size: 11px; color: var(--muted); margin-top: auto; }
.deshacer { background: none; border: 0; padding: 0; text-decoration: underline; font-size: 11px; color: var(--muted); }
.corazon-vuela { position: fixed; pointer-events: none; font-size: 28px; z-index: 50; animation: vuela 1.2s ease-out forwards; }
@keyframes vuela { to { transform: translateY(-140px) scale(1.6); opacity: 0; } }

/* ---------- preguntas ---------- */
.pregunta-card { text-align: center; }
.pregunta-card .num { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.pregunta-card h3 { font-family: "Lora", serif; font-weight: 600; font-size: 21px; margin: 10px 0 16px; }
textarea, input[type=text], input[type=date] { width: 100%; font: inherit; color: var(--texto); background: #fff; border: 2px solid var(--linea);
  border-radius: 12px; padding: 12px; outline: none; }
textarea:focus, input:focus { border-color: var(--tinta-suave); }
textarea { min-height: 80px; resize: vertical; }
.fila-btn { display: flex; gap: 10px; margin-top: 10px; }
.btn { flex: 1; border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; background: var(--tinta); color: #fff; }
.btn.sec { background: #fff; color: var(--tinta); border: 2px solid var(--tinta); }
.btn:disabled { opacity: .5; }
.respuestas { display: grid; gap: 8px; margin-top: 14px; text-align: left; }
.resp { background: var(--papel2); border-radius: 12px; padding: 10px 12px; }
.resp b { color: var(--tinta); font-size: 12.5px; display: block; }
.oculta { color: var(--muted); font-style: italic; }
details.historial { margin-top: 14px; }
details.historial summary { cursor: pointer; color: var(--tinta); font-weight: 700; list-style: none; }
details.historial summary::before { content: "＋ "; }
details.historial[open] summary::before { content: "－ "; }
.hist-item { border-top: 1px dashed var(--linea); padding: 10px 0; }
.hist-item p { margin: 0 0 6px; font-weight: 600; }

/* ---------- planes ---------- */
.progreso { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.progreso i { flex: 1; height: 8px; border-radius: 8px; background: var(--rosa); overflow: hidden; position: relative; }
.progreso i::after { content: ""; position: absolute; inset: 0; width: var(--p); background: var(--tinta); border-radius: 8px; transition: width .5s; }
.plan { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px dashed var(--linea); cursor: pointer; user-select: none; }
.plan:last-child { border-bottom: 0; }
.caja { width: 26px; height: 26px; flex: none; border: 2.5px solid var(--tinta); border-radius: 7px 4px 8px 3px; display: grid; place-items: center; background: #fff; }
.caja svg { width: 18px; height: 18px; stroke: var(--tinta); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset .35s ease; }
.plan .txt { flex: 1; position: relative; transition: color .3s; }
.plan .txt::after { content: ""; position: absolute; left: -2px; top: 52%; height: 2.5px; width: 0; background: var(--tinta); border-radius: 2px; transition: width .4s ease; }
.plan.hecho .caja svg { stroke-dashoffset: 0; }
.plan.hecho .txt { color: var(--muted); }
.plan.hecho .txt::after { width: calc(100% + 4px); }
.plan .borrar { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 0 4px; }
.agregar { display: flex; gap: 8px; margin-top: 12px; }
.agregar .btn { flex: none; }

/* ---------- cápsulas ---------- */
.capsulas { display: grid; gap: 12px; }
.capsula { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; background: #fffdf8; border: 2px solid var(--linea); border-radius: 16px; padding: 14px; }
.capsula.cerrada { background: repeating-linear-gradient(135deg, #fffdf8 0 12px, #fff3f8 12px 24px); }
.capsula .ico { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--rosa); }
.capsula .ico svg { width: 26px; height: 26px; stroke: var(--tinta); stroke-width: 2.2; fill: none; stroke-linecap: round; }
.capsula.cerrada .ico svg { animation: tiembla 3s infinite; }
@keyframes tiembla { 0%, 90%, 100% { transform: rotate(0); } 93% { transform: rotate(-10deg); } 96% { transform: rotate(10deg); } }
.capsula .info { flex: 1; display: grid; gap: 2px; }
.capsula .info b { font-family: "Caveat", cursive; font-size: 24px; color: var(--tinta); line-height: 1.05; }
.capsula .info small { color: var(--muted); font-size: 12.5px; }
.nueva { display: grid; gap: 10px; margin-top: 14px; }
.nueva label { font-size: 13px; color: var(--muted); font-weight: 600; }

/* ---------- día a día ---------- */
.dias { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dia { text-align: center; display: grid; gap: 6px; align-content: start; }
.dia .quien-es { font-family: "Caveat", cursive; font-size: 26px; color: var(--tinta); }
.dia .emoji-grande { font-size: 44px; line-height: 1.1; min-height: 50px; }
.dia .frase { font-size: 13.5px; min-height: 20px; }
.dia .vacio { color: var(--muted); font-style: italic; font-size: 13px; }
.emojis { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 6px; }
.emojis button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--linea); background: #fff; font-size: 20px; padding: 0; }
.emojis button.sel { border-color: var(--tinta); background: var(--rosa); }
.mi-dia { margin-top: 12px; display: grid; gap: 8px; }
.semana { display: grid; gap: 6px; margin-top: 14px; font-size: 13px; }
.semana div { display: flex; gap: 8px; align-items: baseline; }
.semana span:first-child { color: var(--muted); width: 74px; flex: none; }

/* ---------- carta final ---------- */
.carta-final { margin-top: 70px; position: relative; padding: 34px 24px 30px; border-radius: 6px;
  background: linear-gradient(#fffdf7, #fbeedd); box-shadow: 0 2px 0 #e9d6c0, 0 18px 40px #c8106a22; transform: rotate(-.6deg);
  font-family: "Lora", serif; font-size: 17px; line-height: 1.75; }
.carta-final::before { content: ""; position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; transform: translateX(-50%) rotate(2deg);
  background: #ffd9e8cc; border-radius: 3px; }
.carta-final p { margin: 0 0 16px; }
.carta-final .firma { text-align: right; font-family: "Caveat", cursive; font-weight: 700; font-size: 40px; color: var(--tinta); margin: 10px 0 0; }

/* ---------- modal / bloqueo / avisos ---------- */
.modal { position: fixed; inset: 0; background: #4a2a3899; display: grid; place-items: center; padding: 16px; z-index: 40; animation: aparece .2s; }
@keyframes aparece { from { opacity: 0; } }
.modal .carta-final { margin: 0; max-height: 86vh; overflow: auto; width: min(520px, 100%); transform: none; }
.modal .cerrar { position: sticky; top: 0; float: right; background: var(--tinta); color: #fff; border: 0; border-radius: 50%; width: 34px; height: 34px; font-size: 16px; }
.bloqueo { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 12px; padding: 16px; }
.bloqueo h1 { font-size: 72px; margin: 0; transform: rotate(-3deg); }
.bloqueo input { text-align: center; font-size: 30px; letter-spacing: .45em; font-weight: 700; padding-left: calc(12px + .45em); }
.bloqueo input.mal { border-color: #e0374f; animation: temblor .4s; }
@keyframes temblor { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--texto); color: #fff; padding: 11px 16px; border-radius: 12px;
  font-weight: 600; z-index: 60; max-width: 90vw; }
.aviso { background: #fff3cd; border: 1px solid #e6c26b; color: #6b4e00; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 16px; }
.cargando { min-height: 100vh; display: grid; place-items: center; font-size: 60px; }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
@media (max-width: 370px) { .vales { grid-template-columns: 1fr; } .dias { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"><div class="cargando mano">💗</div></main>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./js/config.js";

const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parrafos = (t) => String(t || "").split(/\n{2,}/).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
const hoyKey = (ms = Date.now()) => new Date(ms - 5 * 3600e3).toISOString().slice(0, 10); // fecha en Colombia
const fechaBonita = (iso) => new Date(iso).toLocaleDateString("es-CO", { day: "numeric", month: "long", year: "numeric", timeZone: "America/Bogota" });
const diaCorto = (k) => new Date(k + "T12:00:00-05:00").toLocaleDateString("es-CO", { weekday: "short", day: "numeric", timeZone: "America/Bogota" });
function toast(m) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };

const S = { meta: null, contenido: null, info: null, filas: [], capsulas: [], preguntaIdx: null, emoji: null };
const yo = () => S.info.jugador, otro = () => (S.info.jugador === 1 ? 2 : 1);
const nombre = (j) => S.info.miembros.find((m) => m.jugador === j)?.nombre || "Tu pareja";

// ---------- descifrar el contenido personal (cartas, vales, planes, preguntas, texto final) ----------
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function descifrar(codigo) {
  const m = S.meta;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(codigo), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(m.salt), iterations: m.iter, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(m.iv) }, key, b64(m.data));
  const d = JSON.parse(new TextDecoder().decode(plano));
  return Array.isArray(d) ? { cartas: d, rincon: {} } : d;
}

// ---------- datos compartidos: Supabase o modo demo ----------
function backendSupabase() {
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    async info() { const { data: { session } } = await sb.auth.getSession(); if (!session) return null; return ok(await sb.rpc("mi_info")); },
    async listar() { return ok(await sb.from("rincon").select("*").order("creada_en")); },
    async capsulas() { return ok(await sb.rpc("capsulas")) || []; },
    async crear(f) { return ok(await sb.from("rincon").insert({ pareja_id: S.info.id, jugador: yo(), ...f }).select().single()); },
    async guardar(f) { return ok(await sb.from("rincon").upsert({ pareja_id: S.info.id, jugador: yo(), ...f }, { onConflict: "pareja_id,jugador,tipo,clave" }).select().single()); },
    async borrar(id) { ok(await sb.from("rincon").delete().eq("id", id)); },
  };
}
function backendDemo() {
  const K = "nosotros-rincon-demo";
  const leer = () => { try { return JSON.parse(localStorage.getItem(K)) || []; } catch { return []; } };
  const escribir = (v) => { try { localStorage.setItem(K, JSON.stringify(v)); } catch {} };
  const visible = (r) => r.tipo !== "capsula" || r.jugador === yo() || new Date(r.abre_en) <= new Date();
  return {
    async info() {
      let d = null; try { d = JSON.parse(localStorage.getItem("nosotros-demo-v1")); } catch {}
      if (!d?.pareja) return null;
      return { id: "demo", codigo: d.pareja.codigo, jugador: d.activo || 1, miembros: d.pareja.miembros };
    },
    async listar() { return leer().filter(visible); },
    async capsulas() { return leer().filter((r) => r.tipo === "capsula").map(({ id, jugador, titulo, abre_en, creada_en }) => ({ id, jugador, titulo, abre_en, creada_en })); },
    async crear(f) {
      const v = leer();
      if (v.some((r) => r.jugador === yo() && r.tipo === f.tipo && r.clave === f.clave)) throw new Error("Ya existe");
      const r = { id: crypto.randomUUID(), jugador: yo(), datos: {}, creada_en: new Date().toISOString(), ...f }; v.push(r); escribir(v); return r;
    },
    async guardar(f) {
      const v = leer(); const i = v.findIndex((r) => r.jugador === yo() && r.tipo === f.tipo && r.clave === f.clave);
      if (i >= 0) { v[i] = { ...v[i], ...f }; escribir(v); return v[i]; }
      return this.crear(f);
    },
    async borrar(id) { escribir(leer().filter((r) => r.id !== id)); },
  };
}
const configurado = SUPABASE_URL && SUPABASE_ANON_KEY;
const be = configurado && window.supabase ? backendSupabase() : backendDemo();
const filas = (tipo) => S.filas.filter((r) => r.tipo === tipo);
const fila = (tipo, clave, jugador) => S.filas.find((r) => r.tipo === tipo && r.clave === clave && (jugador == null || r.jugador === jugador));
async function recargar() { [S.filas, S.capsulas] = await Promise.all([be.listar(), be.capsulas()]); }

// ---------- pantallas ----------
function pantallaBloqueo() {
  app.innerHTML = `<a class="volver" href="./" aria-label="Volver">‹</a><section class="bloqueo">
    <h1 class="mano">Siempre tuyo</h1>
    <p style="color:var(--muted)">Hola, ${esc(S.meta.para)}. Escribe el código para entrar.</p>
    <form id="f" style="display:grid;gap:12px"><input id="cod" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" required>
    <button class="btn" type="submit">Abrir</button></form></section>`;
  const f = document.getElementById("f"), inp = document.getElementById("cod"); inp.focus();
  f.onsubmit = async (e) => {
    e.preventDefault();
    try { S.contenido = await descifrar(inp.value.trim()); ss.set("nosotros-cartas", inp.value.trim()); await entrar(); }
    catch { inp.value = ""; inp.classList.add("mal"); setTimeout(() => inp.classList.remove("mal"), 450); toast("Ese no es el código"); }
  };
}
function pantallaSinPareja() {
  app.innerHTML = `<section class="bloqueo"><h1 class="mano">Siempre tuyo</h1>
    <p>Primero entra a la app con tu pareja para que esto se guarde para los dos.</p><a class="btn" href="./" style="text-decoration:none">Ir a la app</a></section>`;
}

const ICONO_CANDADO = `<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="16" r="1.2"/></svg>`;
const ICONO_ABIERTO = `<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/><circle cx="12" cy="16" r="1.2"/></svg>`;
const EMOJIS = ["🥰", "😊", "😴", "😔", "😤", "🤒", "💪", "🥲", "🤯", "😌"];

function render() {
  const R = S.contenido.rincon || {};
  app.innerHTML = `<a class="volver" href="./" aria-label="Volver">‹</a>
  <header class="portada"><h1 class="mano">Siempre tuyo</h1><p>${esc(R.subtitulo || "")}</p></header>
  <nav class="indice"><a href="#vales">Vales</a><a href="#preguntas">Preguntas</a><a href="#planes">Planes</a><a href="#capsulas">Cápsulas</a><a href="#dia">Día a día</a></nav>
  ${!configurado ? `<div class="aviso">Modo demo: se guarda solo en este navegador.</div>` : ""}
  <section class="bloque" id="vales"><h2 class="mano">Vales</h2><p class="intro">Tócalo para canjearlo.</p><div class="vales" id="lista-vales"></div></section>
  <section class="bloque" id="preguntas"><h2 class="mano">Preguntas</h2><p class="intro">Cada uno responde. Las respuestas del otro se ven cuando ya respondiste tú.</p><div id="caja-preguntas"></div></section>
  <section class="bloque" id="planes"><h2 class="mano">Planes</h2><p class="intro">Lo que nos falta por hacer juntos.</p><div class="tarjeta" id="caja-planes"></div></section>
  <section class="bloque" id="capsulas"><h2 class="mano">Cápsulas</h2><p class="intro">Mensajes que solo se abren el día que tú decidas.</p><div id="caja-capsulas"></div></section>
  <section class="bloque" id="dia"><h2 class="mano">Día a día</h2><p class="intro">Cómo va tu día, en un emoji y una frase.</p><div id="caja-dia"></div></section>
  <article class="carta-final">${parrafos(R.final)}<p class="firma">${esc(R.firma || "Siempre tuyo")}</p></article>
  <footer>Hecho con amor, a la distancia</footer>`;
  pintarVales(); pintarPreguntas(); pintarPlanes(); pintarCapsulas(); pintarDia();
}

// ---------- vales ----------
function pintarVales() {
  const vales = S.contenido.rincon?.vales || [];
  const cont = document.getElementById("lista-vales");
  cont.innerHTML = vales.map((v) => {
    const r = fila("vale", v.id);
    return `<button class="vale ${r ? "canjeado" : ""}" data-id="${esc(v.id)}"><small>Vale por</small><b>${esc(v.titulo)}</b><span>${esc(v.detalle || "")}</span>
      ${r ? `<span class="quien">Canjeado por ${esc(nombre(r.jugador))} · <span class="deshacer" data-deshacer="${esc(r.id)}">deshacer</span></span><span class="sello">Canjeado</span>` : ""}</button>`;
  }).join("");
  cont.querySelectorAll(".vale").forEach((b) => b.onclick = async (e) => {
    const des = e.target.closest("[data-deshacer]");
    try {
      if (des) { await be.borrar(des.dataset.deshacer); }
      else if (!fila("vale", b.dataset.id)) {
        await be.crear({ tipo: "vale", clave: b.dataset.id });
        const c = document.createElement("div"); c.className = "corazon-vuela"; c.textContent = "💗";
        c.style.left = e.clientX - 14 + "px"; c.style.top = e.clientY - 14 + "px"; document.body.appendChild(c); setTimeout(() => c.remove(), 1300);
      } else return;
      await recargar(); pintarVales();
    } catch (x) { toast(x.message); }
  });
}

// ---------- preguntas ----------
function pintarPreguntas() {
  const P = S.contenido.rincon?.preguntas || [];
  const cont = document.getElementById("caja-preguntas");
  if (!P.length) { cont.innerHTML = ""; return; }
  const resp = (i, j) => fila("trivia", String(i), j);
  if (S.preguntaIdx == null) {
    const pendientes = P.map((_, i) => i).filter((i) => !resp(i, yo()));
    const pool = pendientes.length ? pendientes : P.map((_, i) => i);
    S.preguntaIdx = pool[Math.floor(Math.random() * pool.length)];
  }
  const i = S.preguntaIdx, mia = resp(i, yo()), suya = resp(i, otro());
  const respondidas = P.map((q, k) => ({ q, k })).filter(({ k }) => resp(k, yo()) || resp(k, otro()));
  const bloqueResp = (k) => {
    const a = resp(k, yo()), b = resp(k, otro());
    return `<div class="resp"><b>${esc(nombre(yo()))}</b>${a ? esc(a.datos.r) : `<span class="oculta">Sin responder</span>`}</div>
            <div class="resp"><b>${esc(nombre(otro()))}</b>${b ? (a ? esc(b.datos.r) : `<span class="oculta">Ya respondió. Responde tú para verla</span>`) : `<span class="oculta">Todavía no responde</span>`}</div>`;
  };
  cont.innerHTML = `<div class="tarjeta pregunta-card">
      <div class="num">Pregunta ${i + 1} de ${P.length}</div><h3>${esc(P[i])}</h3>
      <textarea id="mi-resp" maxlength="300" placeholder="Tu respuesta…">${esc(mia?.datos?.r || "")}</textarea>
      <div class="fila-btn"><button class="btn sec" id="otra">Otra pregunta</button><button class="btn" id="guardar-resp">${mia ? "Actualizar" : "Responder"}</button></div>
      ${mia || suya ? `<div class="respuestas">${bloqueResp(i)}</div>` : ""}
    </div>
    ${respondidas.length ? `<details class="historial"><summary>Ver respondidas (${respondidas.length})</summary>
      ${respondidas.map(({ q, k }) => `<div class="hist-item"><p>${esc(q)}</p><div class="respuestas" style="margin-top:6px">${bloqueResp(k)}</div></div>`).join("")}</details>` : ""}`;
  document.getElementById("otra").onclick = () => {
    const opciones = P.map((_, k) => k).filter((k) => k !== i);
    const sinResp = opciones.filter((k) => !resp(k, yo()));
    const pool = sinResp.length ? sinResp : opciones;
    S.preguntaIdx = pool[Math.floor(Math.random() * pool.length)]; pintarPreguntas();
  };
  document.getElementById("guardar-resp").onclick = async () => {
    const t = document.getElementById("mi-resp").value.trim();
    if (!t) return toast("Escribe tu respuesta primero");
    try { await be.guardar({ tipo: "trivia", clave: String(i), datos: { r: t } }); await recargar(); pintarPreguntas(); toast("Guardada"); }
    catch (x) { toast(x.message); }
  };
}

// ---------- planes ----------
function pintarPlanes() {
  const base = (S.contenido.rincon?.planes || []).map((p) => ({ id: p.id, texto: p.texto }));
  const propios = filas("deseo").map((r) => ({ id: "d-" + r.id, texto: r.datos.texto, fila: r }));
  const todos = [...base, ...propios];
  const hechos = todos.filter((p) => fila("plan", p.id)).length;
  const pct = todos.length ? Math.round((hechos / todos.length) * 100) : 0;
  const cont = document.getElementById("caja-planes");
  cont.innerHTML = `<div class="progreso"><span>${hechos} de ${todos.length} cumplidos</span><i style="--p:${pct}%"></i></div>
    ${todos.map((p) => `<div class="plan ${fila("plan", p.id) ? "hecho" : ""}" data-id="${esc(p.id)}">
      <span class="caja"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span class="txt">${esc(p.texto)}</span>
      ${p.fila && p.fila.jugador === yo() ? `<button class="borrar" data-borrar="${esc(p.fila.id)}" aria-label="Quitar">×</button>` : ""}</div>`).join("")}
    <form class="agregar" id="f-plan"><input type="text" id="nuevo-plan" maxlength="80" placeholder="Agregar un plan…"><button class="btn" type="submit">Agregar</button></form>`;
  cont.querySelectorAll(".plan").forEach((el) => el.onclick = async (e) => {
    try {
      const del = e.target.closest("[data-borrar]");
      if (del) { await be.borrar(del.dataset.borrar); const h = fila("plan", el.dataset.id); if (h) await be.borrar(h.id); }
      else { const h = fila("plan", el.dataset.id); if (h) await be.borrar(h.id); else { el.classList.add("hecho"); await be.crear({ tipo: "plan", clave: el.dataset.id }); } }
      await recargar(); pintarPlanes();
    } catch (x) { toast(x.message); }
  });
  document.getElementById("f-plan").onsubmit = async (e) => {
    e.preventDefault();
    const t = document.getElementById("nuevo-plan").value.trim(); if (!t) return;
    try { await be.crear({ tipo: "deseo", clave: crypto.randomUUID().slice(0, 12), datos: { texto: t } }); await recargar(); pintarPlanes(); }
    catch (x) { toast(x.message); }
  };
}

// ---------- cápsulas ----------
function pintarCapsulas() {
  const ahora = Date.now();
  const cartas = (S.contenido.cartas || []).map((c) => ({ carta: c }));
  const caps = S.capsulas.map((c) => ({ cap: c, contenido: S.filas.find((r) => r.id === c.id) }));
  const cont = document.getElementById("caja-capsulas");
  const item = (x, k) => {
    if (x.carta) return `<button class="capsula" data-k="${k}"><span class="ico">${ICONO_ABIERTO}</span><span class="info"><b>${esc(x.carta.titulo)}</b><small>Carta · abierta</small></span></button>`;
    const c = x.cap, abierta = new Date(c.abre_en).getTime() <= ahora, puedoLeer = abierta || c.jugador === yo();
    const dias = Math.ceil((new Date(c.abre_en).getTime() - ahora) / 86400e3);
    const estado = abierta ? "Ya se puede abrir" : `Se abre el ${fechaBonita(c.abre_en)} · faltan ${dias} ${dias === 1 ? "día" : "días"}`;
    return `<button class="capsula ${abierta ? "" : "cerrada"}" data-k="${k}"><span class="ico">${abierta ? ICONO_ABIERTO : ICONO_CANDADO}</span>
      <span class="info"><b>${esc(c.titulo || "Cápsula")}</b><small>De ${esc(nombre(c.jugador))} · ${estado}${!abierta && puedoLeer ? " (tú la escribiste)" : ""}</small></span></button>`;
  };
  const lista = [...cartas, ...caps];
  const manana = hoyKey(ahora + 86400e3);
  cont.innerHTML = `<div class="capsulas">${lista.map(item).join("") || `<p class="intro">Todavía no hay cápsulas.</p>`}</div>
    <details class="historial" id="det-nueva"><summary>Nueva cápsula</summary>
      <form class="nueva" id="f-cap">
        <label>Título<input type="text" id="cap-titulo" maxlength="60" placeholder="Ej. Para cuando nos veamos" required></label>
        <label>Mensaje<textarea id="cap-msg" maxlength="2000" placeholder="Lo que quieras decir…" required></textarea></label>
        <label>Se abre el<input type="date" id="cap-fecha" min="${manana}" value="${manana}" required></label>
        <button class="btn" type="submit">Guardar cápsula</button>
      </form></details>`;
  cont.querySelectorAll(".capsula").forEach((b) => b.onclick = () => {
    const x = lista[Number(b.dataset.k)];
    if (x.carta) return abrirCarta(x.carta.titulo, x.carta.texto, x.carta.firma);
    const abierta = new Date(x.cap.abre_en).getTime() <= Date.now();
    if (!x.contenido) return toast(abierta ? "Recarga la página para abrirla" : `Todavía no. Se abre el ${fechaBonita(x.cap.abre_en)}`);
    abrirCarta(x.cap.titulo, x.contenido.datos.mensaje, `De ${nombre(x.cap.jugador)}`,
      x.cap.jugador === yo() ? x.cap.id : null);
  });
  document.getElementById("f-cap").onsubmit = async (e) => {
    e.preventDefault();
    const titulo = document.getElementById("cap-titulo").value.trim(), mensaje = document.getElementById("cap-msg").value.trim();
    const fecha = document.getElementById("cap-fecha").value;
    if (!titulo || !mensaje || !fecha) return;
    try {
      await be.crear({ tipo: "capsula", clave: crypto.randomUUID().slice(0, 12), titulo, datos: { mensaje }, abre_en: new Date(fecha + "T00:00:00-05:00").toISOString() });
      await recargar(); pintarCapsulas(); toast("Cápsula guardada. Se abre el " + fechaBonita(fecha + "T12:00:00-05:00"));
    } catch (x) { toast(x.message); }
  };
}
function abrirCarta(titulo, texto, firma, borrarId) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<article class="carta-final"><button class="cerrar" aria-label="Cerrar">✕</button>
    <h2 class="mano" style="font-size:40px;margin:0 0 12px;line-height:1">${esc(titulo)}</h2>${parrafos(texto)}
    <p class="firma">${esc(firma || "")}</p>${borrarId ? `<button class="btn sec" id="borrar-cap" style="width:100%;margin-top:10px">Borrar cápsula</button>` : ""}</article>`;
  document.body.appendChild(m);
  m.onclick = (e) => { if (e.target === m || e.target.closest(".cerrar")) m.remove(); };
  const bb = m.querySelector("#borrar-cap");
  if (bb) bb.onclick = async () => { try { await be.borrar(borrarId); m.remove(); await recargar(); pintarCapsulas(); } catch (x) { toast(x.message); } };
}

// ---------- día a día ----------
function pintarDia() {
  const hoy = hoyKey(), mio = fila("dia", hoy, yo()), suyo = fila("dia", hoy, otro());
  if (S.emoji == null) S.emoji = mio?.datos?.emoji || null;
  const col = (j, r) => `<div class="tarjeta dia"><div class="quien-es">${esc(nombre(j))}</div>
    ${r ? `<div class="emoji-grande">${esc(r.datos.emoji || "")}</div><div class="frase">${esc(r.datos.frase || "")}</div>` : `<div class="emoji-grande"></div><div class="vacio">Todavía no cuenta su día</div>`}</div>`;
  const semana = [];
  for (let d = 1; d <= 6; d++) {
    const k = hoyKey(Date.now() - d * 86400e3), a = fila("dia", k, yo()), b = fila("dia", k, otro());
    if (a || b) semana.push(`<div><span>${esc(diaCorto(k))}</span><span>${a ? esc(nombre(yo()) + ": " + a.datos.emoji + " " + (a.datos.frase || "")) : ""}${a && b ? " · " : ""}${b ? esc(nombre(otro()) + ": " + b.datos.emoji + " " + (b.datos.frase || "")) : ""}</span></div>`);
  }
  document.getElementById("caja-dia").innerHTML = `<div class="dias">${col(yo(), mio)}${col(otro(), suyo)}</div>
    <div class="tarjeta mi-dia"><b style="color:var(--tinta)">¿Cómo va tu día?</b>
      <div class="emojis">${EMOJIS.map((e) => `<button type="button" class="${S.emoji === e ? "sel" : ""}" data-e="${e}">${e}</button>`).join("")}</div>
      <input type="text" id="frase" maxlength="120" placeholder="Una frase corta…" value="${esc(mio?.datos?.frase || "")}">
      <button class="btn" id="guardar-dia">${mio ? "Actualizar" : "Guardar"}</button></div>
    ${semana.length ? `<details class="historial"><summary>Días anteriores</summary><div class="semana">${semana.join("")}</div></details>` : ""}`;
  document.querySelectorAll(".emojis button").forEach((b) => b.onclick = () => {
    S.emoji = b.dataset.e; document.querySelectorAll(".emojis button").forEach((x) => x.classList.toggle("sel", x === b));
  });
  document.getElementById("guardar-dia").onclick = async () => {
    if (!S.emoji) return toast("Escoge un emoji");
    try { await be.guardar({ tipo: "dia", clave: hoy, datos: { emoji: S.emoji, frase: document.getElementById("frase").value.trim() } }); await recargar(); pintarDia(); toast("Listo 💗"); }
    catch (x) { toast(x.message); }
  };
}

// ---------- arranque ----------
async function entrar() {
  S.info = await be.info();
  if (!S.info) return pantallaSinPareja();
  try { await recargar(); }
  catch (x) {
    S.filas = []; S.capsulas = [];
    toast(/rincon|capsulas|schema cache|does not exist/i.test(x.message) ? "Falta correr rincon.sql en Supabase" : x.message);
  }
  render();
  setInterval(async () => {
    if (document.hidden || document.querySelector(".modal") || document.activeElement?.matches("textarea, input")) return;
    const antes = JSON.stringify([S.filas, S.capsulas]);
    try { await recargar(); } catch { return; }
    if (antes !== JSON.stringify([S.filas, S.capsulas])) { pintarVales(); pintarPlanes(); pintarCapsulas(); pintarDia(); }
  }, 20000);
}
(async () => {
  try { const r = await fetch("data/cartas.json", { cache: "no-cache" }); S.meta = await r.json(); }
  catch { app.innerHTML = `<section class="bloqueo"><h1 class="mano">Siempre tuyo</h1><p>No se pudo cargar. Recarga la página.</p></section>`; return; }
  const cod = ss.get("nosotros-cartas");
  if (cod) { try { S.contenido = await descifrar(cod); return entrar(); } catch {} }
  pantallaBloqueo();
})();
</script>
</body>
</html>
